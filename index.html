<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!-- Vite rewrites this public-file URL with the deploy base, so it resolves
         to /app/manifest.json on the web build and /manifest.json on mobile.

         THE URL IS FIXED; THE ANSWER IS NOT. The server builds this manifest
         from the league the request's HOSTNAME resolves to (server/app.ts →
         src/lib/pwaManifest.ts), so shinobistrikerleague.com installs as
         Shinobi Striker League while tko.cam — and the Capacitor APK, which
         has no server and reads the static public/manifest.json — install as
         TKO. The id is here so src/main.tsx can re-point the href on the
         `tko.cam/<slug>` PATH rung, where the host alone cannot say which
         league is being served. -->
    <link rel="manifest" id="app-manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TKO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TKO.cam - Every angle of the knockout. One cam.</title>
    <meta name="description" content="TKO.cam: synchronized multi-angle games, live events, tournaments, clans, and highlight reels." />
    <meta property="og:title" content="TKO.cam - Every angle. One cam." />
    <meta property="og:description" content="Synchronized multi-angle games, live events, tournaments, clans, and highlight reels." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tko.cam/" />
    <meta property="og:site_name" content="TKO.cam" />
    <meta property="og:image" content="https://tko.cam/brand/tko-social-card.png?v=20260725-tko" />
    <meta property="og:image:secure_url" content="https://tko.cam/brand/tko-social-card.png?v=20260725-tko" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="TKO.cam multi-angle gaming logo" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TKO.cam - Every angle. One cam." />
    <meta name="twitter:description" content="Synchronized multi-angle games, live events, tournaments, clans, and highlight reels." />
    <meta name="twitter:image" content="https://tko.cam/brand/tko-social-card.png?v=20260725-tko" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <!-- Ad network scripts inject at runtime only when configured in

  </body>
