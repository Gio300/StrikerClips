workflows:
  shinobi-ios-testflight:
    name: Shinobi Striker League iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.shinobistrikerleague.app
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        TKO_NATIVE_BRAND: shinobistrikerleague
        TKO_NATIVE_PLATFORMS: ios
        VITE_NATIVE_LEAGUE_SLUG: shinobistrikerleague
        VITE_NATIVE_DEEP_LINK_SCHEME: shinobistrikerleague
        VITE_MOBILE_STORE_BUILD: "1"
        VITE_REAL_BACKEND: "1"
        VITE_API_BASE: https://tko.cam
      node: 22
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install JavaScript dependencies
        script: npm ci

      - name: Run unit and integration tests
        script: npm test -- --testTimeout=15000

      - name: Build the SSL web application
        script: npm run build

      - name: Sync Capacitor iOS project
        script: npx cap sync ios

      - name: Apply SSL native identity and artwork
        script: node scripts/prepare-native-brand.mjs

      - name: Initialize iOS signing keychain
        script: keychain initialize

      - name: Fetch or create SSL App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add signing certificate to keychain
        script: keychain add-certificates

      - name: Apply App Store signing profiles
        script: xcode-project use-profiles

      - name: Set iOS build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
